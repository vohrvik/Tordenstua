
name: Oppdater ICS-kalender

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-calendar.yml'
      - 'index.html'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tordenstua-pages
  cancel-in-progress: false

jobs:
  sync:
    name: Hent ICS og klargjor nettside
    runs-on: ubuntu-latest

    steps:
      - name: Hent filer
        uses: actions/checkout@v4

      - name: Hent offentlig Google Kalender
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 40 \
            'https://calendar.google.com/calendar/ical/tordenstua%40gmail.com/public/basic.ics' \
            -o calendar.ics.tmp
          grep -q 'BEGIN:VCALENDAR' calendar.ics.tmp
          grep -q 'END:VCALENDAR' calendar.ics.tmp
          mv calendar.ics.tmp calendar.ics

      - name: Klargjor GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Publiser kalender
    needs: sync
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
