
name: Oppdater ICS-kalender

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent offentlig Google Kalender som ICS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --max-time 40 \
            'https://calendar.google.com/calendar/ical/tordenstua%40gmail.com/public/basic.ics' \
            -o calendar.ics.tmp
          grep -q 'BEGIN:VCALENDAR' calendar.ics.tmp
          grep -q 'END:VCALENDAR' calendar.ics.tmp
          mv calendar.ics.tmp calendar.ics

      - name: Publiser bare når innholdet er endret
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Oppdater offentlige kalenderavtaler'
            git push
          fi

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pakk nettstedet
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiser kalendernettsiden
        id: deployment
        uses: actions/deploy-pages@v4
